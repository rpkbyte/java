  <rect width="1200" height="800" fill="#fff8e1"/>
  <rect x="70" y="60" width="1060" height="680" rx="28" fill="#fff3c4" stroke="#e2b84c" stroke-width="6"/>
  <rect x="100" y="90" width="1000" height="620" rx="20" fill="#fffdf5" stroke="#d4a017" stroke-width="3"/>

  <g stroke="#8d6e63" stroke-width="3" fill="none" opacity="0.5">
    <path d="M140 190 H1050"/>
    <path d="M140 240 H1050"/>
    <path d="M140 290 H1050"/>
    <path d="M140 340 H1050"/>
    <path d="M140 390 H1050"/>
