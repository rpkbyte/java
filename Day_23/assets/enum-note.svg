  <g transform="translate(120 140)">
    <text x="0" y="0" font-family="'Comic Sans MS', 'Segoe Print', cursive" font-size="34" fill="#d81b60" font-weight="bold">Enum in Java</text>
    <text x="0" y="55" font-family="'Comic Sans MS', 'Segoe Print', cursive" font-size="28" fill="#1e88e5">A fixed list of choices</text>
    <text x="0" y="105" font-family="'Comic Sans MS', 'Segoe Print', cursive" font-size="26" fill="#0d47a1">Example:</text>
    <text x="0" y="145" font-family="'Comic Sans MS', 'Segoe Print', cursive" font-size="24" fill="#388e3c">enum Direction {</text>
    <text x="35" y="185" font-family="'Comic Sans MS', 'Segoe Print', cursive" font-size="24" fill="#f57c00">NORTH, SOUTH, EAST, WEST;</text>
    <text x="0" y="225" font-family="'Comic Sans MS', 'Segoe Print', cursive" font-size="24" fill="#388e3c">}</text>
    <text x="0" y="280" font-family="'Comic Sans MS', 'Segoe Print', cursive" font-size="24" fill="#6a1b9a">Use it like:</text>
    <text x="0" y="320" font-family="'Comic Sans MS', 'Segoe Print', cursive" font-size="24" fill="#c2185b">Direction d = Direction.EAST;</text>
  </g>

  <g stroke="#f06292" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M900 180 C930 145, 975 145, 1005 180"/>
    <path d="M930 330 C960 300, 1000 300, 1030 330"/>
